name: Deploy Pikazo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vendor/svg-edit/package-lock.json

      - name: Install dependencies
        working-directory: vendor/svg-edit
        run: npm ci

      - name: Build editor
        working-directory: vendor/svg-edit
        run: |
          npx vite build packages/svgcanvas
          npx vite build
          node scripts/copy-static.mjs
          node scripts/build-extensions.mjs

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: vendor/svg-edit/dist/editor

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
